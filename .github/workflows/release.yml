name: Release

# Creates a release containing all scripts from a yyyy.mm.dd tag.

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Check manifests
        run: mise run check:manifest

      - name: Build
        run: mise run build

      - name: Create release notes
        run: |
          PREVIOUS_TAG="$(git tag --list '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]' --sort=-refname | awk -v tag="$TAG" '$0 < tag' | head -n 1)"
          echo "Previous tag: ${PREVIOUS_TAG:-(none)}"
          mise exec -- lua release.lua notes "$PREVIOUS_TAG" > release-notes.md
          cat release-notes.md

      - name: Prepare assets
        # GitHub replaces spaces in asset names with periods; do it explicitly to keep download URLs predictable.
        run: |
          mkdir -p assets
          for file in dist/*.lua; do
            name="${file##*/}"
            cp "$file" "assets/${name// /.}"
          done
          ls -l assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" assets/*.lua \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
