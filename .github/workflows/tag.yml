name: Tag

# Creates a yyyy.mm.dd tag on the latest commit of master if any script version
# has changed since the latest tag, and then creates a release from the tag.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Time zone used to determine the date of the tag
  TZ: Asia/Tokyo

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Check manifests
        run: mise run check:manifest

      - name: Create tag
        id: tag
        run: |
          TAG="$(date +%Y.%m.%d)"
          PREVIOUS_TAG="$(git tag --list '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]' --sort=-refname | head -n 1)"
          echo "Tag: $TAG"
          echo "Previous tag: ${PREVIOUS_TAG:-(none)}"

          CHANGED="$(mise exec -- lua release.lua changed "$PREVIOUS_TAG")"
          if [ "$CHANGED" != "true" ]; then
            echo "::notice title=Skipped::No script has been updated since $PREVIOUS_TAG."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error title=Tag already exists::Tag $TAG already exists. Run this workflow on another day."
            exit 1
          fi

          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so call the release workflow directly.
  release:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
